<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Events Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>School Events</h1>
    </header>

    <main>
        <div class="calendarTop">
            <button type="button" id="prevMonthBtn">&lt;</button>
            <h2 id="monthLabel">August 2026</h2>
            <button type="button" id="nextMonthBtn">&gt;</button>
        </div>

        <!-- colour legend and filter -->
        <div class="filterBar" id="filterBar">
            <span class="filterLabel">Show:</span>

            <label class="filterItem">
                <input type="checkbox" class="filterCheckbox" value="minor" checked>
                <span class="colorDot dot-minor"></span> Minor
            </label>

            <label class="filterItem">
                <input type="checkbox" class="filterCheckbox" value="moderate" checked>
                <span class="colorDot dot-moderate"></span> Moderate
            </label>

            <label class="filterItem">
                <input type="checkbox" class="filterCheckbox" value="major" checked>
                <span class="colorDot dot-major"></span> Major
            </label>

            <!-- added in version 6 so students can only see their year -->
            <label class="filterItem">
                Year:
                <select id="yearFilter">
                    <option value="all">All years</option>
                    <option value="10">Year 10</option>
                    <option value="11">Year 11</option>
                    <option value="12">Year 12</option>
                </select>
            </label>
        </div>

        <!-- days are generated in script.js -->
        <div class="calendar" id="calendar">
            <div class="dayName">Mon</div>
            <div class="dayName">Tue</div>
            <div class="dayName">Wed</div>
            <div class="dayName">Thu</div>
            <div class="dayName">Fri</div>
        </div>
    </main>

    <div class="modalOverlay" id="modalOverlay">
        <div class="modal" id="modal"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
